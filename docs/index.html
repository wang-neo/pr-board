<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katana Server — PR Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            surface: { DEFAULT: '#0d1117', light: '#161b22', lighter: '#1c2129' },
            border: { DEFAULT: '#30363d', light: '#21262d' },
            accent: { DEFAULT: '#58a6ff', dark: '#1f6feb' },
            merged: { DEFAULT: '#3fb950', bg: 'rgba(63,185,80,0.1)', border: 'rgba(63,185,80,0.3)' },
            pending: { DEFAULT: '#d29922', bg: 'rgba(210,153,34,0.1)', border: 'rgba(210,153,34,0.3)' },
            ai: { DEFAULT: '#bc8cff', bg: 'rgba(188,140,255,0.08)', border: 'rgba(188,140,255,0.25)' },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-gray-200 font-sans min-h-screen antialiased">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-surface/80 backdrop-blur-xl border-b border-border">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent-dark flex items-center justify-center">
          <i data-lucide="git-pull-request" class="w-4 h-4 text-white"></i>
        </div>
        <div>
          <a href="https://github.com/bosinc/katana-server" target="_blank"
             class="text-sm font-semibold text-gray-100 hover:text-accent transition-colors duration-200">
            katana-server
          </a>
          <span class="text-xs text-gray-500 ml-2">PR Board</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="prev-btn"
                class="p-2 rounded-lg border border-border hover:bg-surface-lighter transition-colors duration-200 cursor-pointer disabled:opacity-30 disabled:cursor-default"
                title="前一天">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <select id="date-select"
                class="bg-surface-light border border-border rounded-lg px-3 py-1.5 text-sm text-gray-300 cursor-pointer focus:outline-none focus:border-accent transition-colors duration-200">
        </select>
        <button id="next-btn"
                class="p-2 rounded-lg border border-border hover:bg-surface-lighter transition-colors duration-200 cursor-pointer disabled:opacity-30 disabled:cursor-default"
                title="后一天">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Loading -->
    <div id="loading" class="flex flex-col items-center justify-center py-32">
      <div class="spinner w-8 h-8 border-[3px] border-border border-t-accent rounded-full mb-4"></div>
      <p class="text-gray-500 text-sm">Loading report...</p>
    </div>

    <!-- Empty -->
    <div id="empty" class="hidden flex-col items-center justify-center py-32">
      <i data-lucide="inbox" class="w-12 h-12 text-gray-600 mb-4"></i>
      <p class="text-gray-500 text-sm">No reports yet</p>
    </div>

    <!-- Report -->
    <div id="report" class="hidden space-y-6">
      <!-- Bento Stats Grid -->
      <div id="stats-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>

      <!-- Trend Sparkline + AI Summary Row -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
        <!-- Trend Chart -->
        <div id="trend-card" class="lg:col-span-2 bento-card">
          <div class="flex items-center gap-2 mb-4">
            <i data-lucide="trending-up" class="w-4 h-4 text-accent"></i>
            <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">Trend (30 days)</span>
          </div>
          <canvas id="trend-canvas" class="w-full" height="120"></canvas>
        </div>
        <!-- AI Summary -->
        <div id="ai-card" class="hidden bento-card border-ai-border bg-ai-bg">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="sparkles" class="w-4 h-4 text-ai"></i>
            <span class="text-xs font-medium text-ai uppercase tracking-wider">AI Summary</span>
          </div>
          <p id="ai-text" class="text-sm text-gray-300 leading-relaxed"></p>
        </div>
      </div>

      <!-- Authors Bar -->
      <div id="authors-section" class="hidden bento-card">
        <div class="flex items-center gap-2 mb-4">
          <i data-lucide="users" class="w-4 h-4 text-accent"></i>
          <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">Contributors</span>
        </div>
        <div id="authors-bar" class="space-y-2"></div>
      </div>

      <!-- PR Columns -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Merged -->
        <section>
          <div class="flex items-center gap-2 mb-3">
            <div class="w-5 h-5 rounded-full bg-merged-bg border border-merged-border flex items-center justify-center">
              <i data-lucide="git-merge" class="w-3 h-3 text-merged"></i>
            </div>
            <h2 class="text-sm font-semibold text-gray-300">Merged</h2>
            <span id="merged-count" class="text-xs text-gray-500 bg-surface-lighter px-2 py-0.5 rounded-full">0</span>
          </div>
          <div id="merged-list" class="space-y-2"></div>
        </section>

        <!-- Open -->
        <section>
          <div class="flex items-center gap-2 mb-3">
            <div class="w-5 h-5 rounded-full bg-pending-bg border border-pending-border flex items-center justify-center">
              <i data-lucide="clock" class="w-3 h-3 text-pending"></i>
            </div>
            <h2 class="text-sm font-semibold text-gray-300">Pending</h2>
            <span id="open-count" class="text-xs text-gray-500 bg-surface-lighter px-2 py-0.5 rounded-full">0</span>
          </div>
          <div id="open-list" class="space-y-2"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-border mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex items-center justify-between">
      <p class="text-xs text-gray-600">
        Powered by <a href="https://github.com/bosinc/katana-server" target="_blank" class="text-gray-500 hover:text-accent transition-colors">katana-server</a> PR Report
      </p>
      <p class="text-xs text-gray-600">Auto-generated daily</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
