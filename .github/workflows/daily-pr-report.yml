# name: Daily PR Report

on:
  schedule:
    # 9:00 AM CST = 1:00 AM UTC, Mon-Fri only
    - cron: "0 0 * * 1-5"
    # Fallback: 9:30 AM CST in case the first run was skipped
    # - cron: "30 0 * * 0-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts/pr-report

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate and send PR report
        env:
          TZ: Asia/Shanghai
          DATA_DIR: ${{ github.workspace }}/data/reports

          # Repo config — optional, defaults to bosinc/katana-server
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          TARGET_BRANCHES: ${{ secrets.TARGET_BRANCHES }}

          # GitHub — required
          GITHUB_TOKEN: ${{ secrets.PR_REPORT_GITHUB_TOKEN }}

          # Slack — required
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}

          # AI — all optional, skip AI if AI_API_KEY is empty
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MAX_TOKENS: ${{ secrets.AI_MAX_TOKENS }}
        run: node report.mjs

      - name: Commit report data
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ || true
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "chore: add PR report $(date +%Y-%m-%d)"
            git push
          fi

